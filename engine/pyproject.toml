[project]
name = "flow-engine"
version = "1.6.0"
description = "Diktat-Engine für Flow: Whisper, Whistle, Parakeet oder Qwen3-ASR lokal, Korrektur über OpenAI, Claude, Cursor oder Qwen."
requires-python = ">=3.12"
dependencies = [
  "cactus-needle>=3.1.3",
  "mlx-qwen3-asr>=0.4.4",
  "mlx-vlm>=0.4.1",
  "mlx-whisper>=0.4.2",
  "parakeet-mlx>=0.5.3",
]

[project.scripts]
flow-engine = "flow_engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flow_engine"]
